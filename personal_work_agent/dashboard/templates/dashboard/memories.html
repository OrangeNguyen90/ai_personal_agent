{% extends 'dashboard/base.html' %}{% block content %}<h1>Bộ nhớ cá nhân</h1><div class="card"><form method="post">{% csrf_token %}<input type="hidden" name="action" value="add"><textarea name="content" rows="2" maxlength="2000" required placeholder="Thông tin cần ghi nhớ"></textarea><p><button>Ghi nhớ</button></p></form></div><div class="card"><table><tr><th>Nội dung</th><th>Ngày tạo</th><th></th></tr>{% for m in memories %}<tr><td>{{ m.1 }}</td><td>{{ m.2 }}</td><td><form method="post" class="inline">{% csrf_token %}<input type="hidden" name="action" value="delete"><input type="hidden" name="memory_id" value="{{ m.0 }}"><button class="secondary">Xóa</button></form></td></tr>{% empty %}<tr><td colspan="3">Chưa có bộ nhớ.</td></tr>{% endfor %}</table></div>{% endblock %}
