<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Work Agent</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#172333;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#172c46;color:white;padding:18px 5%;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:#e6f2ff;text-decoration:none}header strong{margin-right:auto}main{max-width:1040px;margin:28px auto;padding:0 20px}.card{background:white;border:1px solid #e3e7ee;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #17233308}input,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:10px;width:100%}button{background:#155db6;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer}button.secondary{background:#637389}.flex{display:flex;gap:10px;align-items:center}.flex input{flex:1}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e7ebf0;padding:11px;vertical-align:top}small,.muted{color:#64748b}.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:9px;margin:10px 0;background:#edf4ff}.msg.assistant{background:#f0f3f6}.notice{padding:10px;background:#fff3d6;margin-bottom:12px;border-radius:7px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:27px;font-weight:700}form.inline{display:inline}form.inline button{padding:6px 10px}
</style></head><body><header><strong>Personal Work Agent</strong>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Tổng quan</a><a href="{% url 'chat' %}">AI Chat</a><a href="{% url 'tasks' %}">Công việc</a><a href="{% url 'documents' %}">Tài liệu</a><a href="{% url 'memories' %}">Bộ nhớ</a><form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Đăng xuất</button></form>{% endif %}</header><main>{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
