{% extends 'dashboard/base.html' %}{% block content %}<h1>Quản lý công việc</h1><div class="card"><form method="post" class="flex">{% csrf_token %}<input type="hidden" name="action" value="add"><input name="title" maxlength="250" required placeholder="Tên công việc mới"><button>Thêm</button></form></div><div class="card"><table><tr><th>ID</th><th>Công việc</th><th>Trạng thái</th><th></th></tr>{% for t in tasks %}<tr><td>{{ t.0 }}</td><td>{{ t.1 }}</td><td>{{ t.2 }}</td><td>{% if t.2 != 'done' %}<form method="post" class="inline">{% csrf_token %}<input type="hidden" name="action" value="complete"><input type="hidden" name="task_id" value="{{ t.0 }}"><button>Hoàn thành</button></form>{% endif %}</td></tr>{% empty %}<tr><td colspan="4">Chưa có công việc.</td></tr>{% endfor %}</table></div>{% endblock %}
